services:
  postgres:
    image: postgres:16-alpine
    container_name: studybuddy-postgres
    environment:
      - POSTGRES_USER=studybuddy
      - POSTGRES_PASSWORD=studybuddy
      - POSTGRES_DB=studybuddy
    volumes:
      - studybuddy-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy -d studybuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy-backend-1
    volumes:
      - ./backend/.env:/usr/src/app/.env
      - studybuddy-uploads:/usr/src/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://studybuddy:studybuddy@postgres:5432/studybuddy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy-backend-2
    volumes:
      - ./backend/.env:/usr/src/app/.env
      - studybuddy-uploads:/usr/src/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://studybuddy:studybuddy@postgres:5432/studybuddy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy-backend-3
    volumes:
      - ./backend/.env:/usr/src/app/.env
      - studybuddy-uploads:/usr/src/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://studybuddy:studybuddy@postgres:5432/studybuddy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend-lb:
    image: nginx:alpine
    container_name: studybuddy-backend-lb
    ports:
      - "5001:80"
    volumes:
      - ./nginx-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/react-app
      dockerfile: Dockerfile
    container_name: studybuddy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend-lb
    restart: unless-stopped

volumes:
  studybuddy-uploads:
    name: studybuddy-uploads
  studybuddy-pgdata:
    name: studybuddy-pgdata
