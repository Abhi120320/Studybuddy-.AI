# Nginx Load Balancer Configuration for Study Buddy AI backend
# Distributes traffic across 3 backend replicas

upstream studybuddy_backend {
    least_conn;  # route to backend with fewest active connections

    server backend-1:5000;
    server backend-2:5000;
    server backend-3:5000;

    keepalive 32;  # reuse connections to backends
}

server {
    listen 80;

    # Increase buffer for PDF uploads
    client_max_body_size 100M;
    client_body_timeout  120s;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # Pass all traffic to the backend pool
    location / {
        proxy_pass         http://studybuddy_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Retry on failure — will move to next backend in pool
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Health check endpoint — direct (no upstream needed)
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
